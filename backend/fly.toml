# fly.toml app configuration file generated for mazao-daktari-api on 2026-09-27T14:42:50+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mazao-daktari-api'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile.fly'

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PORT = '8080'
  PHX_HOST = 'mazao-daktari-api.fly.dev'
  # Fly's internal Postgres network (.flycast/.internal) is IPv6-only.
  # config/runtime.exs reads this to add `socket_options: [:inet6]` to the
  # Repo config - without it, Postgrex/the BEAM's DNS resolver fails with
  # :nxdomain even though the hostname resolves fine at the platform level
  # (confirmed live: `getent hosts` via `fly ssh console` resolved it,
  # only the running app's own connection attempts failed).
  ECTO_IPV6 = 'true'
  # The attached Postgres is a single 256MB shared-cpu-1x instance. With 2
  # always-on app machines (see min_machines_running below) each holding a
  # default Ecto pool of 10, that's 20 concurrent connections - confirmed
  # live as the likely cause of a Postgres OOM/crash (connection refused on
  # its own port, repmgrd unable to reconnect) shortly after this app was
  # switched to always-on. 4 per machine (8 total) is comfortably within
  # what a hackathon-scale demo needs.
  POOL_SIZE = '4'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  # Keep at least one machine warm at all times - this is a hackathon demo
  # backend, and a judge's first request hitting a cold-started machine
  # (or, worse, timing out mid-cold-start) is a worse failure mode than the
  # small idle cost of 1 always-on shared-cpu-1x machine.
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
