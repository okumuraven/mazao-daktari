# fly.toml app configuration file generated for mazao-daktari-api on 2026-09-27T14:42:50+03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'mazao-daktari-api'
primary_region = 'jnb'

[build]
  dockerfile = 'Dockerfile.fly'

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PORT = '8080'
  PHX_HOST = 'mazao-daktari-api.fly.dev'
  # Fly's internal Postgres network (.flycast/.internal) is IPv6-only.
  # config/runtime.exs reads this to add `socket_options: [:inet6]` to the
  # Repo config - without it, Postgrex/the BEAM's DNS resolver fails with
  # :nxdomain even though the hostname resolves fine at the platform level
  # (confirmed live: `getent hosts` via `fly ssh console` resolved it,
  # only the running app's own connection attempts failed).
  ECTO_IPV6 = 'true'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
